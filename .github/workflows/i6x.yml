name: i6X firmware

on:
  push:
    branches:
      - '**'
    tags:
      - 'v[0-9]*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-24.04
    container: archlinux:base
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Install C++26 ARM toolchain and build tools
        run: |
          pacman -Syu --noconfirm --needed \
            arm-none-eabi-gcc arm-none-eabi-newlib gcc cmake git ninja python
          arm-none-eabi-g++ --version
          cmake --version

      - name: Check out sources
        uses: actions/checkout@v7

      - name: Configure i6X
        run: cmake --preset i6x

      - name: Test model migration and startup recovery on host
        run: |
          cmake -S . -B build-converter-host -G Ninja -DCORETX_MODUL_TANKMIX=OFF
          cmake --build build-converter-host --target coretx_model_converter_tests coretx_i6x_menu_tests coretx_application_tests --parallel 2
          ctest --test-dir build-converter-host -R '^coretx_(model_converter|i6x_menu|application)$' --output-on-failure

      - name: Build German and English firmware and RF-OFF converter
        run: cmake --build --preset i6x --parallel 2

      - name: Require main and converter artifacts
        run: |
          for image in de en converter; do
            for extension in bin hex; do
              test -s "build-i6x/coretx-i6x-$image.$extension"
            done
          done
          test -s build-i6x/coretx-i6x-converter-resource-report.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        with:
          name: coretx-i6x-de-en
          path: |
            build-i6x/coretx-i6x-*.bin
            build-i6x/coretx-i6x-*.hex
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download firmware
        uses: actions/download-artifact@v8
        with:
          name: coretx-i6x-de-en
          path: firmware

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # The other firmware/simulator workflows may create the release concurrently.
            gh release create "$RELEASE_TAG" \
              --verify-tag \
              --title "CoreTX $RELEASE_TAG" \
              --notes "Experimental firmware for Flysky FS-i6X and FS-i6S (STM32F072). Board-specific German/English main firmware and English RF-OFF converter BIN/HEX images are attached, together with coretx-browser-simulator.zip from the same source version. Extract the simulator ZIP and serve it over HTTP; it is not flashable firmware. Back up firmware and EEPROM first. For native model formats 6/7/8, flash the matching board's converter, confirm conversion to format 9, then switch off and flash the matching main firmware. Converter images are maintenance tools, not transmitter firmware; unsupported or corrupt data requires recovery/reset. Never use another board's image. Flash start address: 0x08000000." \
              || gh release view "$RELEASE_TAG" >/dev/null
          fi
          gh release upload "$RELEASE_TAG" firmware/*.bin firmware/*.hex --clobber
